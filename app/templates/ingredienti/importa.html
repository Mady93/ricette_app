{% extends "base.html" %}
{% block title %}Importazione Massiva Ingredienti{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-3 text-center">Importazione Massiva Ingredienti</h2>
            <p class="text-muted text-center mb-4">Carica il file CSV con l'elenco completo per popolare il database in un colpo solo.</p>
            
            <div class="card p-4 shadow-sm">
                <form method="POST" enctype="multipart/form-data" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="file_csv" class="form-label font-weight-bold">Seleziona file CSV</label>
                        <input class="form-control" type="file" id="file_csv" name="file_csv" accept=".csv" required>
                    </div>
                    
                    <div class="d-flex gap-2 justify-content-between align-items-center mt-4">
                        <button type="submit" class="btn btn-primary">Carica e Importa</button>
                        <a href="{{ url_for('dispensa.elenco') }}" class="text-secondary text-decoration-none">Annulla</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
