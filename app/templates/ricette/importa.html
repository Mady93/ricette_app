{% extends "base.html" %}
{% block title %}Importa Ricette CSV{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="h3 mb-3">Importa Ricette da CSV</h1>
    <p class="text-muted mb-4">
      Seleziona un file CSV per caricare in blocco le ricette nel sistema.
    </p>

    <form method="post" action="{{ url_for('ricette.importa') }}" enctype="multipart/form-data" class="card card-body shadow-sm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="file_csv" class="form-label">Seleziona file CSV</label>
        <input type="file" id="file_csv" name="file_csv" class="form-control" accept=".csv" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="{{ url_for('ricette.elenco') }}" class="btn btn-outline-secondary">Annulla</a>
        <button type="submit" class="btn btn-primary">Carica CSV</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
