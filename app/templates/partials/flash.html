{% with messaggi = get_flashed_messages(with_categories=true) %}
  {% if messaggi %}
    <div class="material-flashes" aria-live="polite">
      {% for categoria, messaggio in messaggi %}
        <div class="mat-snackbar mat-snackbar-{{ categoria }}" role="status">
          <div class="mat-snackbar__message">{{ messaggio }}</div>
          <button type="button" class="mat-snackbar__close" aria-label="Chiudi">×</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
